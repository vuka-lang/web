<script lang="go">
// Package chat is the chat's rooms, /chat/{room}.
package chat

import (
	"context"
	"strings"

	"github.com/vuka-lang/ui/v2"
	"github.com/vuka-lang/web/v2"
	"github.com/vuka-lang/web/v2/examples/live/rooms"
)

// Chat is a room at /chat/{room}: Room binds from the path, log is
// injected. Its lines are a stream: the session sends each line and forgets
// it, the browser keeping the last 200.
type Chat struct {
	ui.Live
	Room  string
	log   *rooms.Log
	lines ui.Stream[rooms.Line]
	name  string
}

func NewChat(log *rooms.Log) *Chat { return &Chat{log: log} }

func (c *Chat) topic() string { return "chat:" + c.Room }

@ui.Mount
func (c *Chat) mount(ctx context.Context) error {
	c.Subscribe(c.topic())
	c.lines.Limit(200)
	c.lines.Reset(c.log.History(c.Room, 200)...)
	return nil
}

func (c *Chat) Update(m rooms.Said)   { c.lines.Insert(m.Line) }
func (c *Chat) Update(j rooms.Joined) { c.lines.Insert(j.Line) }

func (c *Chat) SetName(ctx context.Context, f rooms.Form) error {
	name := strings.TrimSpace(f.Text)
	if name == "" {
		return web.BadRequest("pick a name")
	}
	c.name = name
	return web.Broadcast(ctx, c.topic(), rooms.Joined{Line: c.log.Add(c.Room, name+" joined")})
}

func (c *Chat) Send(ctx context.Context, f rooms.Form) error {
	if strings.TrimSpace(f.Text) == "" {
		return nil
	}
	return web.Broadcast(ctx, c.topic(), rooms.Said{Line: c.log.Add(c.Room, c.name+": "+f.Text)})
}
</script>

<section class="chat">
	<h2>#{Room}</h2>
	<ul class="lines">
		for _, l := range lines.Rows() {
			<li key={l.ID}>{l.Text}</li>
		}
	</ul>
	if name == "" {
		<form class="name" onSubmit={SetName}>
			<input name="text" placeholder="Your name" autocomplete="off" />
			<button>Join</button>
		</form>
	} else {
		<form class="say" onSubmit={Send}>
			<input name="text" placeholder={"Say something, " + name} autocomplete="off" />
			<button>Send</button>
		</form>
	}
</section>
